<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Alex Valdez - Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->
    <div class="container mt-3">
      <h1>About Alex Valdez</h1>
      <ul>
        <li>Veteran</li>
        <li>
          Licensed aircraft mechanic
          <img
            src="images/plane.jpg"
            class="rounded"
            alt="Aircraft in the sky"
            width="300"
            height="300"
          />
        </li>
        <li>
          Beginner programmer:
          <a href="https://github.com/Aval23">Github profile page</a>
        </li>
      </ul>
    </div>
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
