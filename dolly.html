<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Alex Valdez - Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->

    <!-- Carousel -->
    <div id="demo" class="carousel slide" data-bs-ride="carousel">
      <!-- Indicators/dots -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#demo"
          data-bs-slide-to="0"
          class="active"
        ></button>
        <button
          type="button"
          data-bs-target="#demo"
          data-bs-slide-to="1"
        ></button>
        <button
          type="button"
          data-bs-target="#demo"
          data-bs-slide-to="2"
        ></button>
      </div>

      <!-- The slideshow/carousel -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="/images/aval.jpg"
            alt="placeholder"
            class="d-block"
            style="width: 10%"
          />
        </div>
        <div class="carousel-item">
          <img
            src="/images/dolly.jpg"
            alt="placeholder"
            class="d-block"
            style="width: 10%"
          />
        </div>
        <div class="carousel-item">
          <img
            src="/images/plane.jpg"
            alt="placeholder"
            class="d-block"
            style="width: 10%"
          />
        </div>
      </div>

      <!-- Left and right controls/icons -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#demo"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#demo"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>


    <div class="container mt-3">
      <h1>About Dolly Purrton</h1>
      <ul>
        <li>Always sleeping</li>
        <li>Loves playing with string</li>
        <li>
          Beginner programmer:
          <img
            src="dollybycomputer.jpg"
            class="rounded"
            alt="Dolly by computer"
            width="300"
            height="300"
          />
        </li>
      </ul>
    </div>
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
